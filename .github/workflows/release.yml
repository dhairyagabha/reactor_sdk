name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify release candidate
        run: bundle exec rake
      - name: Build gem
        run: gem build reactor_sdk.gemspec
      - name: Publish to RubyGems.org
        uses: rubygems/release-gem@v1
